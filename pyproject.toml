[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mortarbench-inspect"
version = "1.0.0"
description = "MortarBench: evaluating LLM agents on mortgage loan origination (Inspect AI task)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "Matthew Toles" },
    { name = "Yunan Lu" },
    { name = "Manav Munjal" },
    { name = "Bojun Liu" },
    { name = "Yuanhao Deng" },
    { name = "Stephanie Selig" },
    { name = "Derek Rindner" },
    { name = "Cheng Li" },
    { name = "Zhou Yu" },
]
keywords = ["llm", "evaluation", "benchmark", "finance", "mortgage", "agents"]
dependencies = [
    "inspect_ai>=0.3.100",
    "datasets>=2.16",
]

[project.urls]
Paper = "https://arxiv.org/abs/2606.19416"
Dataset = "https://huggingface.co/datasets/ManavMunjal/MortarBench"
Repository = "https://github.com/mtoles/MortarBench"

# Only the Inspect task is packaged; the research scripts at the repo root are
# run directly and are not part of the distribution.
[tool.setuptools]
packages = ["inspect_evals", "inspect_evals.mortarbench"]
